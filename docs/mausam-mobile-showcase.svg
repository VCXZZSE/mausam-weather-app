<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Mausam mobile weather dashboard showcase</title>
  <desc id="desc">A promotional composition showing the Mausam Kolkata weather dashboard inside a modern phone.</desc>
  <defs>
    <linearGradient id="background" x1="40" y1="20" x2="1120" y2="700" gradientUnits="userSpaceOnUse">
      <stop stop-color="#EAFBFF"/><stop offset="0.46" stop-color="#CDECF5"/><stop offset="1" stop-color="#AFCBE9"/>
    </linearGradient>
    <radialGradient id="aura" cx="0" cy="0" r="1" gradientTransform="translate(931 306) rotate(124) scale(470 430)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#75D8ED" stop-opacity=".66"/><stop offset="1" stop-color="#75D8ED" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="phone" x1="770" y1="30" x2="1100" y2="684" gradientUnits="userSpaceOnUse">
      <stop stop-color="#253A45"/><stop offset="1" stop-color="#081116"/>
    </linearGradient>
    <linearGradient id="screen" x1="780" y1="48" x2="1087" y2="669" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F5FCFE"/><stop offset=".55" stop-color="#DDF2F8"/><stop offset="1" stop-color="#CFE6F4"/>
    </linearGradient>
    <linearGradient id="weather" x1="804" y1="187" x2="1085" y2="407" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1B3643"/><stop offset=".55" stop-color="#11262F"/><stop offset="1" stop-color="#09161D"/>
    </linearGradient>
    <linearGradient id="rainCloud" x1="936" y1="216" x2="1038" y2="297" gradientUnits="userSpaceOnUse">
      <stop stop-color="#C9C4EA"/><stop offset="1" stop-color="#9D96CC"/>
    </linearGradient>
    <linearGradient id="aqi" x1="823" y1="494" x2="926" y2="494" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2BCB75"/><stop offset=".55" stop-color="#F4C13D"/><stop offset="1" stop-color="#FF715B"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-20%" width="160%" height="160%"><feDropShadow dx="0" dy="28" stdDeviation="26" flood-color="#173B54" flood-opacity=".3"/></filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="13" flood-color="#2D6F8D" flood-opacity=".15"/></filter>
    <filter id="cloudGlow" x="-30%" y="-40%" width="160%" height="190%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#77D8EE" flood-opacity=".3"/></filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#FFFFFF" stroke-opacity=".18"/></pattern>
    <clipPath id="screenClip"><rect x="782" y="48" width="306" height="624" rx="39"/></clipPath>
  </defs>

  <rect width="1200" height="720" rx="42" fill="url(#background)"/>
  <rect width="1200" height="720" rx="42" fill="url(#aura)"/>
  <rect width="1200" height="720" rx="42" fill="url(#grid)" opacity=".35"/>
  <circle cx="104" cy="86" r="210" fill="#FFFFFF" opacity=".22"/>
  <circle cx="620" cy="680" r="250" fill="#7CA7DF" opacity=".13"/>

  <g transform="translate(82 76)">
    <g transform="translate(0 2)" fill="none" stroke="#174D78" stroke-width="3.2" stroke-linecap="round">
      <circle cx="25" cy="19" r="10" fill="#56BDE0" stroke="none"/>
      <path d="M25 3v5M25 30v5M9 19h5M36 19h5M14 8l4 4M36 30l4 4"/>
      <path d="M5 39h31c7 0 10-4 10-9s-4-9-10-9c-3-8-14-9-20-3C8 17 2 22 3 29c-5 1-7 4-7 7 0 2 3 3 9 3Z" fill="#174D78" stroke="none"/>
    </g>
    <text x="64" y="34" fill="#143F63" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="27" font-weight="800" letter-spacing="2">MAUSAM</text>
  </g>

  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <rect x="82" y="156" width="202" height="34" rx="17" fill="#FFFFFF" fill-opacity=".58" stroke="#FFFFFF" stroke-opacity=".78"/>
    <circle cx="104" cy="173" r="5" fill="#4FBBD7"/>
    <text x="119" y="178" fill="#315D7B" font-size="13" font-weight="750" letter-spacing="1.2">KOLKATA · DAILY VIEW</text>
    <text x="78" y="274" fill="#123A5B" font-size="61" font-weight="850" letter-spacing="-3">
      <tspan x="78">Weather that</tspan><tspan x="78" dy="66">feels made for</tspan><tspan x="78" dy="66" fill="#348CB1">your day.</tspan>
    </text>
    <text x="82" y="500" fill="#315D7B" font-size="19" font-weight="500">
      <tspan x="82">Health, movement, rain and local context—</tspan><tspan x="82" dy="30">brought together in one calm daily briefing.</tspan>
    </text>
    <g transform="translate(82 572)" font-size="13" font-weight="750">
      <rect width="102" height="40" rx="20" fill="#FFFFFF" fill-opacity=".55"/><circle cx="21" cy="20" r="5" fill="#F7B932"/><text x="34" y="25" fill="#234F70">AQI 78</text>
      <rect x="112" width="88" height="40" rx="20" fill="#FFFFFF" fill-opacity=".55"/><circle cx="133" cy="20" r="5" fill="#FF8E42"/><text x="146" y="25" fill="#234F70">UV 6</text>
      <rect x="210" width="118" height="40" rx="20" fill="#FFFFFF" fill-opacity=".55"/><circle cx="231" cy="20" r="5" fill="#5998F4"/><text x="244" y="25" fill="#234F70">RAIN 92%</text>
    </g>
    <text x="82" y="658" fill="#4F738B" font-size="13" font-weight="650" letter-spacing="1.6">RESPONSIVE WEB · ANDROID · LIGHT + DARK</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="760" y="22" width="350" height="676" rx="64" fill="url(#phone)"/>
    <rect x="768" y="30" width="334" height="660" rx="56" fill="#91ACB7" fill-opacity=".26" stroke="#FFFFFF" stroke-opacity=".32"/>
    <rect x="782" y="48" width="306" height="624" rx="39" fill="url(#screen)"/>
  </g>

  <g clip-path="url(#screenClip)" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <circle cx="1068" cy="92" r="92" fill="#7FE0F0" opacity=".18"/><circle cx="812" cy="560" r="110" fill="#8AB5F0" opacity=".13"/>
    <g transform="translate(804 78)">
      <circle cx="12" cy="10" r="7" fill="#56BDE0"/><path d="M2 19h22c5 0 7-3 7-6s-3-6-7-6c-2-5-9-6-13-2C6 4 2 8 3 12c-4 1-5 3-5 5 0 1 1 2 4 2Z" fill="#174D78"/>
      <text x="40" y="17" fill="#173F60" font-size="18" font-weight="850">Mausam</text>
    </g>
    <g transform="translate(1003 72)"><rect width="57" height="31" rx="16" fill="#C0E3EE" stroke="#80B7CA" stroke-opacity=".5"/><circle cx="18" cy="15.5" r="11" fill="#FFF0B8"/><circle cx="41" cy="15.5" r="5" fill="#657993"/></g>

    <g filter="url(#softShadow)">
      <rect x="800" y="123" width="270" height="49" rx="18" fill="#FFFFFF" fill-opacity=".62" stroke="#FFFFFF" stroke-opacity=".74"/>
      <circle cx="822" cy="147" r="12" fill="#FFDEA0"/><path d="m817 147 5-6 5 6-5 6Z" fill="#173F60"/>
      <text x="844" y="143" fill="#173F60" font-size="11" font-weight="800">Good morning, Kolkata</text><text x="844" y="159" fill="#55758B" font-size="8" font-weight="600">Your personal weather briefing</text>
      <path d="m1051 141 6 6-6 6" fill="none" stroke="#173F60" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <g filter="url(#softShadow)">
      <rect x="800" y="187" width="270" height="218" rx="27" fill="url(#weather)" stroke="#D7F4FA" stroke-opacity=".2"/>
      <circle cx="1034" cy="210" r="82" fill="#63CDE9" opacity=".08"/><circle cx="818" cy="390" r="64" fill="#6D8BF4" opacity=".09"/>
      <circle cx="821" cy="211" r="10" fill="#6CCBE1" fill-opacity=".22"/>
      <path d="M821 204a5 5 0 0 0-5 5c0 4 5 10 5 10s5-6 5-10a5 5 0 0 0-5-5Zm0 7a2 2 0 1 1 0-4 2 2 0 0 1 0 4Z" fill="#D8F8FF"/>
      <text x="838" y="215" fill="#EAFBFF" font-size="10" font-weight="750">Kolkata, West Bengal</text>
      <text x="817" y="294" fill="#FFFFFF" font-size="70" font-weight="850" letter-spacing="-5">31</text><text x="884" y="267" fill="#FFFFFF" font-size="32" font-weight="500">°</text>
      <text x="818" y="326" fill="#EAF6F8" font-size="16" font-weight="750">Heavy Monsoon Rain</text><text x="818" y="347" fill="#98B1BA" font-size="10" font-weight="600">Feels 37° · H:32° L:25°</text>
      <g filter="url(#cloudGlow)">
        <path d="M929 254c-2-12 7-21 19-21 5-14 23-18 34-8 14-8 31 0 33 14 11 0 19 8 19 18 0 11-8 18-21 18h-64c-13 0-20-8-20-21Z" fill="url(#rainCloud)" stroke="#665F98" stroke-width="2"/>
        <circle cx="965" cy="255" r="2.4" fill="#2E2A49"/><circle cx="984" cy="255" r="2.4" fill="#2E2A49"/><path d="M970 264q5-5 10 0" fill="none" stroke="#2E2A49" stroke-width="2" stroke-linecap="round"/>
        <path d="m974 273-8 25h11l-6 25 25-34h-13l8-16Z" fill="#FFE45C" stroke="#D7AD36"/>
        <ellipse cx="981" cy="341" rx="48" ry="8" fill="#A7DDE9" fill-opacity=".28"/><ellipse cx="981" cy="341" rx="27" ry="3" fill="#D9F3F4" fill-opacity=".34"/>
      </g>
      <path d="M817 365H1053" stroke="#D7F4FA" stroke-opacity=".15"/>
      <g fill="#AFC6CE" font-size="8" font-weight="700" text-anchor="middle"><text x="852" y="383">WIND · SW</text><text x="935" y="383">HUMIDITY</text><text x="1022" y="383">VISIBILITY</text></g>
      <g fill="#FFFFFF" font-size="13" font-weight="850" text-anchor="middle"><text x="852" y="399">22 km/h</text><text x="935" y="399">89%</text><text x="1022" y="399">3.2 km</text></g>
    </g>

    <text x="802" y="435" fill="#45677F" font-size="8" font-weight="850" letter-spacing="1.4">TODAY'S METRICS</text>
    <g filter="url(#softShadow)">
      <rect x="800" y="450" width="130" height="128" rx="22" fill="#FFFFFF" fill-opacity=".56" stroke="#FFFFFF" stroke-opacity=".76"/><rect x="940" y="450" width="130" height="128" rx="22" fill="#FFFFFF" fill-opacity=".56" stroke="#FFFFFF" stroke-opacity=".76"/>
      <rect x="800" y="588" width="130" height="92" rx="22" fill="#FFFFFF" fill-opacity=".5" stroke="#FFFFFF" stroke-opacity=".72"/><rect x="940" y="588" width="130" height="92" rx="22" fill="#FFFFFF" fill-opacity=".5" stroke="#FFFFFF" stroke-opacity=".72"/>
    </g>
    <g>
      <rect x="878" y="462" width="39" height="20" rx="10" fill="#FFF7D7" stroke="#F4CE58" stroke-opacity=".65"/><text x="897.5" y="476" fill="#9B6B08" font-size="8" font-weight="850" text-anchor="middle">AQI 78</text>
      <text x="816" y="482" fill="#4A6D84" font-size="8" font-weight="850" letter-spacing="1">AIR QUALITY</text><text x="865" y="519" fill="#173F60" font-size="18" font-weight="850" text-anchor="middle">Satisfactory</text>
      <rect x="821" y="535" width="88" height="5" rx="2.5" fill="#D5E2E7"/><rect x="821" y="535" width="39" height="5" rx="2.5" fill="url(#aqi)"/>
      <text x="830" y="560" fill="#53748A" font-size="7" font-weight="750">PM2.5</text><text x="881" y="560" fill="#53748A" font-size="7" font-weight="750">PM10</text><text x="830" y="573" fill="#173F60" font-size="13" font-weight="850">42</text><text x="881" y="573" fill="#173F60" font-size="13" font-weight="850">68</text>
    </g>
    <g text-anchor="middle">
      <rect x="1024" y="462" width="34" height="20" rx="10" fill="#FFF0E5" stroke="#FFAE76" stroke-opacity=".7"/><text x="1041" y="476" fill="#C96523" font-size="8" font-weight="850">HIGH</text>
      <text x="1005" y="482" fill="#4A6D84" font-size="8" font-weight="850" letter-spacing="1">UV INDEX</text><text x="1005" y="533" fill="#173F60" font-size="42" font-weight="850">6</text><text x="1005" y="556" fill="#365B74" font-size="10" font-weight="800">Use SPF 30+</text><text x="1005" y="572" fill="#688498" font-size="7" font-weight="700">Peak · 11 AM–2 PM</text>
      <text x="865" y="610" fill="#4A6D84" font-size="8" font-weight="850" letter-spacing="1">BEST RUN TIME</text><text x="865" y="640" fill="#173F60" font-size="15" font-weight="850">5:30–7:00 AM</text><text x="865" y="658" fill="#26775F" font-size="8" font-weight="750">Sunrise · 5:21 AM</text>
      <text x="1005" y="610" fill="#4A6D84" font-size="8" font-weight="850" letter-spacing="1">RAINFALL TODAY</text><text x="1005" y="642" fill="#173F60" font-size="24" font-weight="850">34.2<tspan font-size="10"> mm</tspan></text><text x="1005" y="659" fill="#688498" font-size="8" font-weight="750">Month · 312 mm</text>
    </g>
  </g>
  <rect x="882" y="56" width="106" height="25" rx="13" fill="#071116"/><circle cx="975" cy="68.5" r="4" fill="#1E3946"/><path d="M1120 176v78M1120 280v50" stroke="#46616C" stroke-width="5" stroke-linecap="round"/>
</svg>
